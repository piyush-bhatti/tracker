name: Nightly pull from Notion

on:
  schedule:
    - cron: "0 2 * * *"      # 02:00 UTC every day
  workflow_dispatch:         # lets you trigger it by hand from the Actions tab

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull Notion -> CSV
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_notion.py pull
      - name: Build public page
        run: python build_site.py
      - name: Commit if anything changed
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add positions.csv contacts.csv snapshots docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "nightly pull $(date -u +%F)"
            git push
          fi
